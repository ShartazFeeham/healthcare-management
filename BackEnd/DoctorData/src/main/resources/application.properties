# Initials
server.port = 7200

# Database connection
spring.datasource.url = jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/healthcare_doctors?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username = ${DB_USER:healthcare}
spring.datasource.password = ${DB_PASSWORD:healthcare}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = false
