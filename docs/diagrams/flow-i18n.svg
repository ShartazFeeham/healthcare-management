<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#3d8bff" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#3d8bff"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">1</text><text x="82" y="413" font-size="14" fill="#e8f0ff">On load the app fetches the whole dictionary once, then picks the user's language (e.g. Bengali).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.01154;0.2;0.21154;1" dur="10.4s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#4cd964" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#4cd964"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">2</text><text x="82" y="413" font-size="14" fill="#e8f0ff">The seeder pre-loaded every interface string in ten languages, so no internet is required.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21154;0.22308;0.41154;0.42308;1" dur="10.4s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#9a7bff" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#9a7bff"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">3</text><text x="82" y="413" font-size="14" fill="#e8f0ff">Only a string that is missing from the dictionary is sent to the translator integration ...</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42308;0.43462;0.62308;0.63462;1" dur="10.4s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#ff5c5c" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#ff5c5c"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">4</text><text x="82" y="413" font-size="14" fill="#e8f0ff">... and only when the machine is online. When offline it fails fast and the English text is kept.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63462;0.64615;0.83462;0.84615;1" dur="10.4s" repeatCount="indefinite" /></g>
