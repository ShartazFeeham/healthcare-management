<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#ffb84d" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#ffb84d"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">1</text><text x="82" y="413" font-size="14" fill="#e8f0ff">Option 5 cleans old containers and volumes, then starts MySQL 8.4 and creates one schema per service.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.00811;0.14054;0.14865;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#3d8bff" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#3d8bff"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">2</text><text x="82" y="413" font-size="14" fill="#e8f0ff">Services start in order (registry, config, then the rest), each waiting until it answers.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14865;0.15676;0.28919;0.2973;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#9a7bff" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#9a7bff"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">3</text><text x="82" y="413" font-size="14" fill="#e8f0ff">The React build is served by a tiny dependency-free static server on port 3100.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2973;0.30541;0.43784;0.44595;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#4cd964" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#4cd964"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">4</text><text x="82" y="413" font-size="14" fill="#e8f0ff">The seeder fills the system through the real APIs: 54 users, about 2,000 appointments, posts, reports, translations.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44595;0.45405;0.58649;0.59459;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#4cd964" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#4cd964"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">5</text><text x="82" y="413" font-size="14" fill="#e8f0ff">An end-to-end suite drives the UI in headless Chrome and verifies the effects through the APIs.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59459;0.6027;0.73514;0.74324;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#16263d" stroke="#ff6f91" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#ff6f91"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#06101f">6</text><text x="82" y="413" font-size="14" fill="#e8f0ff">A tour captures every screen for the showcase site.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74324;0.75135;0.88378;0.89189;1" dur="14.8s" repeatCount="indefinite" /></g>
