<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EA Healthcare · slideshow</title>
<style>
  html, body { margin: 0; height: 100%; background: #08111f; color: #eaf2ff; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { height: 100%; display: grid; grid-template-rows: 1fr auto; }
  .view { position: relative; overflow: hidden; }
  .view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0; transition: opacity .7s; }
  .view img.on { opacity: 1; }
  .meta { padding: 14px 18px; background: linear-gradient(0deg, #08111f, #0d1a2e); display: flex; gap: 16px; align-items: center; }
  .meta b { display: block; font-size: 16px; } .meta span { color: #94abc9; font-size: 13px; }
  .dots { margin-left: auto; display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #24405f; cursor: pointer; } .dots i.on { background: #3d8bff; }
</style></head>
<body><div class="wrap"><div class="view" id="view"></div><div class="meta"><div><b id="t"></b><span id="c"></span></div><div class="dots" id="dots"></div></div></div>
<script type="module">
  // Embeddable auto-playing slideshow: <iframe src="embed.html" style="width:100%;aspect-ratio:16/10;border:0"></iframe>
  const shots = (await (await fetch("data/shots.json")).json()).filter((s) => !s.mobile && s.group !== "ops");
  const view = document.getElementById("view"), dots = document.getElementById("dots"); let i = 0;
  shots.forEach((s, n) => { const im = new Image(); im.src = s.file; im.alt = s.title; view.append(im); const d = document.createElement("i"); d.onclick = () => go(n); dots.append(d); });
  const go = (n) => { i = n; [...view.children].forEach((x, k) => x.classList.toggle("on", k === i)); [...dots.children].forEach((x, k) => x.classList.toggle("on", k === i)); document.getElementById("t").textContent = shots[i].title; document.getElementById("c").textContent = shots[i].caption; };
  go(0); setInterval(() => go((i + 1) % shots.length), 5000);
</script></body></html>
