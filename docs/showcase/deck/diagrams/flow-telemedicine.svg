<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 580" width="1200" height="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="1200" height="580" rx="22" fill="#fff" stroke="#e5e5ea"/>
<text x="30" y="40" fill="#1d1d1f" font-size="21" font-weight="800">Telemedicine without a cloud video service</text>
<text x="30" y="62" fill="#6e6e73" font-size="13">Access is verified server-side; media flows peer to peer over WebRTC</text>

