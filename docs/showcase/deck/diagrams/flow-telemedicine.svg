<use href="#halo-rtc" opacity="0" style="fill:#2a9d4b"><animate attributeName="opacity" values="0;0;.32;.32;0;0" keyTimes="0;0.74324;0.75135;0.88378;0.89189;1" dur="14.8s" repeatCount="indefinite" /></use>
<g opacity="0"><rect x="30" y="518" width="1140" height="40" rx="12" fill="#ffffff" stroke="#0f9d84" stroke-opacity=".7"/><circle cx="58" cy="538" r="12" fill="#0f9d84"/><text x="58" y="542.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text><text x="82" y="543" font-size="14" fill="#1d1d1f">The doctor opens the call link; the service checks the appointment belongs to them and the join window is open.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.00811;0.14054;0.14865;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="518" width="1140" height="40" rx="12" fill="#ffffff" stroke="#d93a72" stroke-opacity=".7"/><circle cx="58" cy="538" r="12" fill="#d93a72"/><text x="58" y="542.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text><text x="82" y="543" font-size="14" fill="#1d1d1f">The patient is verified the same way (window: 5 minutes before to 20 minutes after, adjusted for delays).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14865;0.15676;0.28919;0.2973;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="518" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="538" r="12" fill="#c77700"/><text x="58" y="542.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text><text x="82" y="543" font-size="14" fill="#1d1d1f">Both browsers announce themselves; the lower ID creates a WebRTC offer and sends it through the channel.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2973;0.30541;0.43784;0.44595;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="518" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="538" r="12" fill="#c77700"/><text x="58" y="542.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text><text x="82" y="543" font-size="14" fill="#1d1d1f">The answer and ICE candidates come back the same way. No signalling server is needed.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44595;0.45405;0.58649;0.59459;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="518" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="538" r="12" fill="#2a9d4b"/><text x="58" y="542.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text><text x="82" y="543" font-size="14" fill="#1d1d1f">Peers connect directly. Audio and video travel encrypted between the two browsers.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59459;0.6027;0.73514;0.74324;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="518" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="538" r="12" fill="#2a9d4b"/><text x="58" y="542.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">6</text><text x="82" y="543" font-size="14" fill="#1d1d1f">Mute, camera, link-copy and end-call controls act on the local streams.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74324;0.75135;0.88378;0.89189;1" dur="14.8s" repeatCount="indefinite" /></g>
</svg>