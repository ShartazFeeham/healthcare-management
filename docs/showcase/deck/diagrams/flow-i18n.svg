<use href="#halo-g" opacity="0" style="fill:#d03a3a"><animate attributeName="opacity" values="0;0;.32;.32;0;0" keyTimes="0;0.63462;0.64615;0.83462;0.84615;1" dur="10.4s" repeatCount="indefinite" /></use>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#1f6fe5"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text><text x="82" y="413" font-size="14" fill="#1d1d1f">On load the app fetches the whole dictionary once, then picks the user's language (e.g. Bengali).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.01154;0.2;0.21154;1" dur="10.4s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#2a9d4b"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text><text x="82" y="413" font-size="14" fill="#1d1d1f">The seeder pre-loaded every interface string in ten languages, so no internet is required.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.21154;0.22308;0.41154;0.42308;1" dur="10.4s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#6f4be8" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#6f4be8"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text><text x="82" y="413" font-size="14" fill="#1d1d1f">Only a string that is missing from the dictionary is sent to the translator integration ...</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42308;0.43462;0.62308;0.63462;1" dur="10.4s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#d03a3a" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#d03a3a"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text><text x="82" y="413" font-size="14" fill="#1d1d1f">... and only when the machine is online. When offline it fails fast and the English text is kept.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63462;0.64615;0.83462;0.84615;1" dur="10.4s" repeatCount="indefinite" /></g>
