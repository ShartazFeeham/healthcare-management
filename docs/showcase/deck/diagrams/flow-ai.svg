<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#1f6fe5"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text><text x="82" y="443" font-size="14" fill="#1d1d1f">The patient (or their doctor) requests a report for patient ID PER1.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.00811;0.14054;0.14865;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#2a9d4b"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text><text x="82" y="443" font-size="14" fill="#1d1d1f">CDSS loads the patient's treatments and every other patient's treatment keywords.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14865;0.15676;0.28919;0.2973;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#0f9d84" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#0f9d84"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text><text x="82" y="443" font-size="14" fill="#1d1d1f">Cases are ranked by keyword overlap; the two closest are anonymised (copied, IDs hidden).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2973;0.30541;0.43784;0.44595;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#6f4be8" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#6f4be8"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text><text x="82" y="443" font-size="14" fill="#1d1d1f">A structured prompt with the patient data and the similar cases goes to the Integration service.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44595;0.45405;0.58649;0.59459;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#c77700"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text><text x="82" y="443" font-size="14" fill="#1d1d1f">The local analyst writes the analysis from the data plus a clinical knowledge base (specialists, tests, advice).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59459;0.6027;0.73514;0.74324;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#2a9d4b"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">6</text><text x="82" y="443" font-size="14" fill="#1d1d1f">The report is stored, then shown as three sections with the anonymised cases beside it.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74324;0.75135;0.88378;0.89189;1" dur="14.8s" repeatCount="indefinite" /></g>
