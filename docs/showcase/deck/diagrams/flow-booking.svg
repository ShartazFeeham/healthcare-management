<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#1f6fe5"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text><text x="82" y="443" font-size="14" fill="#1d1d1f">POST /appointments with the JWT: patient, doctor, date and shift.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.00706;0.12235;0.12941;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#2a9d4b"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text><text x="82" y="443" font-size="14" fill="#1d1d1f">Checks the doctor's schedule, the slot capacity and past times, then assigns the next free serial and time.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12941;0.13647;0.25176;0.25882;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#0f9d84" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#0f9d84"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text><text x="82" y="443" font-size="14" fill="#1d1d1f">A notification (title, text, deep link) is sent to the patient and the doctor.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25882;0.26588;0.38118;0.38824;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#6f4be8" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#6f4be8"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text><text x="82" y="443" font-size="14" fill="#1d1d1f">Notification applies each user's preferences (channels, do-not-disturb, categories) and fans out.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38824;0.39529;0.51059;0.51765;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#2a9d4b"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text><text x="82" y="443" font-size="14" fill="#1d1d1f">Email, SMS and push are delivered to the local outbox; the bell badge counts unseen items.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51765;0.52471;0.64;0.64706;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#c77700"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">6</text><text x="82" y="443" font-size="14" fill="#1d1d1f">Scheduled jobs scan upcoming appointments (daily, hourly, every five minutes) ...</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64706;0.65412;0.76941;0.77647;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="418" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="438" r="12" fill="#c77700"/><text x="58" y="442.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">7</text><text x="82" y="443" font-size="14" fill="#1d1d1f">... and send reminders, adjusted automatically for any delay the doctor has announced.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77647;0.78353;0.89882;0.90588;1" dur="17.000000000000004s" repeatCount="indefinite" /></g>
</svg>