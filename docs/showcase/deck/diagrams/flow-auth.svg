<use href="#halo-spa" opacity="0" style="fill:#2a9d4b"><animate attributeName="opacity" values="0;0;.32;.32;0;0" keyTimes="0;0.74324;0.75135;0.88378;0.89189;1" dur="14.8s" repeatCount="indefinite" /></use>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#1f6fe5"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text><text x="82" y="413" font-size="14" fill="#1d1d1f">Patient submits the registration form (validated in the browser and again on the server).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.00811;0.14054;0.14865;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#d93a72" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#d93a72"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text><text x="82" y="413" font-size="14" fill="#1d1d1f">Patients service creates the profile and asks Account to create the login with the same user ID (PER1).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14865;0.15676;0.28919;0.2973;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#c77700"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text><text x="82" y="413" font-size="14" fill="#1d1d1f">Account stores a BCrypt password hash, marks the account locked and generates a 6-digit OTP.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2973;0.30541;0.43784;0.44595;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#c77700" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#c77700"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text><text x="82" y="413" font-size="14" fill="#1d1d1f">Account asks Integration to email the OTP. In production this is SMTP; locally it is captured.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44595;0.45405;0.58649;0.59459;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#6f4be8" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#6f4be8"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text><text x="82" y="413" font-size="14" fill="#1d1d1f">Integration records the message in the local outbox: nothing leaves the machine.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59459;0.6027;0.73514;0.74324;1" dur="14.8s" repeatCount="indefinite" /></g>
<g opacity="0"><rect x="30" y="388" width="1140" height="40" rx="12" fill="#ffffff" stroke="#2a9d4b" stroke-opacity=".7"/><circle cx="58" cy="408" r="12" fill="#2a9d4b"/><text x="58" y="412.5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">6</text><text x="82" y="413" font-size="14" fill="#1d1d1f">The user reads the code in the mailbox page, verifies, and receives a signed JWT (role in the claims).</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74324;0.75135;0.88378;0.89189;1" dur="14.8s" repeatCount="indefinite" /></g>
</svg>